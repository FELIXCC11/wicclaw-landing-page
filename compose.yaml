services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set the public HTTPS origin}
        WICCLAW_DEPLOYMENT_STAGE: production
    env_file: .env.production
    environment:
      WICCLAW_DEPLOYMENT_STAGE: production
      WICCLAW_LOCAL_PREVIEW: "false"
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
